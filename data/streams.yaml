# Stream Definitions
# Each stream represents a research direction in the archive.
# Papers reference streams by their `id` slug.

streams:
  - id: belief-elicitation
    name: "Belief Elicitation & Calibration"
    short_name: "Belief Elicitation"
    icon: "🎯"
    color: "#4A90D9"
    question: "How do we extract what people actually believe under uncertainty, and how well-calibrated are those beliefs?"
    keywords:
      - belief elicitation
      - probability elicitation
      - calibration
      - scoring rules
      - overconfidence
      - subjective probability
      - distribution builder
      - Bayesian updating
    related_streams:
      - uncertainty-communication
      - utility-decision-quality
      - agents-as-advisors

  - id: uncertainty-communication
    name: "Uncertainty Communication: Visual, Textual, Agent-Mediated"
    short_name: "Uncertainty Communication"
    icon: "📊"
    color: "#7B68EE"
    question: "How should uncertainty be presented so people understand it and act on it well?"
    keywords:
      - uncertainty visualization
      - risk communication
      - error bars
      - fan charts
      - icon arrays
      - hypothetical outcome plots
      - natural frequencies
      - verbal probability
      - framing effects
    related_streams:
      - belief-elicitation
      - attention-memory-salience
      - sampling-representation

  - id: utility-decision-quality
    name: "Utility Elicitation, Decision Quality & Normative Benchmarks"
    short_name: "Utility & Decision Quality"
    icon: "⚖️"
    color: "#E8833A"
    question: "How do we measure what people value, and how do we assess whether their choices are good by their own standards?"
    keywords:
      - expected utility
      - prospect theory
      - utility function
      - decision quality
      - certainty equivalent
      - loss aversion
      - value function
      - preference elicitation
      - regret theory
      - normative model
    related_streams:
      - belief-elicitation
      - risk-ambiguity
      - agents-as-advisors

  - id: attention-memory-salience
    name: "Attention, Memory, Salience & Cognitive Load"
    short_name: "Attention & Salience"
    icon: "🧠"
    color: "#50C878"
    question: "How do interfaces shape what people notice, remember, and weigh in their decisions?"
    keywords:
      - bounded rationality
      - salience
      - attention
      - cognitive load
      - choice architecture
      - nudge
      - information overload
      - working memory
      - decision fatigue
    related_streams:
      - uncertainty-communication
      - temporal-dynamics
      - agents-as-advisors

  - id: risk-ambiguity
    name: "Risk, Ambiguity & Controllability"
    short_name: "Risk & Ambiguity"
    icon: "🎲"
    color: "#DC4C64"
    question: "How do people process different types and sources of uncertainty, and how does perceived control modulate behavior?"
    keywords:
      - risk aversion
      - ambiguity aversion
      - Knightian uncertainty
      - Ellsberg paradox
      - source preference
      - model uncertainty
      - illusion of control
      - ambiguity attitudes
    related_streams:
      - utility-decision-quality
      - sampling-representation
      - agents-as-advisors

  - id: temporal-dynamics
    name: "Temporal Dynamics: Myopia, Feedback & Time Horizon"
    short_name: "Temporal Dynamics"
    icon: "⏳"
    color: "#FFB347"
    question: "How does the temporal structure of decisions — feedback timing, evaluation frequency, planning horizon — shape risk-taking and learning?"
    keywords:
      - myopic loss aversion
      - evaluation frequency
      - time discounting
      - present bias
      - feedback timing
      - exploration exploitation
      - dynamic reference point
      - learning from experience
    related_streams:
      - sampling-representation
      - attention-memory-salience
      - utility-decision-quality

  - id: sampling-representation
    name: "Sampling, Granularity, Tails & Uncertainty Representation"
    short_name: "Sampling & Representation"
    icon: "📈"
    color: "#9B59B6"
    question: "How do people learn about distributions from experience, and how does the granularity and format of uncertainty information affect judgment?"
    keywords:
      - description-experience gap
      - sampling
      - rare events
      - probability weighting
      - distributional thinking
      - tail risk
      - histogram
      - density display
    related_streams:
      - belief-elicitation
      - uncertainty-communication
      - temporal-dynamics

  - id: agents-as-advisors
    name: "AI Agents as Elicitors, Explainers & Calibrated Advisors"
    short_name: "Agents as Advisors"
    icon: "🤖"
    color: "#2ECC71"
    question: "How can LLMs and other AI agents serve as partners in human decision-making — eliciting preferences, explaining trade-offs, and providing calibrated advice?"
    keywords:
      - algorithm aversion
      - algorithm appreciation
      - human-AI decision making
      - AI advisor
      - LLM calibration
      - explainability
      - delegation
      - complementarity
      - trust in AI
    related_streams:
      - belief-elicitation
      - uncertainty-communication
      - utility-decision-quality
      - attention-memory-salience
