# Master Paper Registry
# Each entry corresponds to a digest file in content/papers/{id}.md
# This file is the single source of truth for paper metadata used by the build script.

papers:

  # --- Stream 3: Utility / Decision Quality (primary) ---
  - id: kahneman-tversky-1979
    title: "Prospect Theory: An Analysis of Decision Under Risk"
    authors: [Daniel Kahneman, Amos Tversky]
    year: 1979
    venue: Econometrica
    url: "https://doi.org/10.2307/1914185"
    streams: [utility-decision-quality, risk-ambiguity, sampling-representation, belief-elicitation]
    era: foundational
    tags: [prospect-theory, value-function, probability-weighting, loss-aversion,
           certainty-effect, reflection-effect, isolation-effect, reference-dependence]

