  <script src="/assets/js/main.js"></script>
  
<script>
(function() {
  const searchInput = document.getElementById('search-input');
  const filterStream = document.getElementById('filter-stream');
  const filterEra = document.getElementById('filter-era');
  const paperList = document.getElementById('paper-list');
  const resultsCount = document.getElementById('results-count');
  const rows = paperList.querySelectorAll('.paper-row');

  function applyFilters() {
    const query = searchInput.value.toLowerCase().trim();
    const stream = filterStream.value;
    const era = filterEra.value;
    let count = 0;

    rows.forEach(row => {
      const title = row.dataset.title || '';
      const authors = row.dataset.authors || '';
      const tags = row.dataset.tags || '';
      const rowStreams = row.dataset.streams || '';
      const rowEra = row.dataset.era || '';

      const matchesSearch = !query ||
        title.includes(query) ||
        authors.includes(query) ||
        tags.includes(query);
      const matchesStream = !stream || rowStreams.includes(stream);
      const matchesEra = !era || rowEra === era;

      if (matchesSearch && matchesStream && matchesEra) {
        row.style.display = '';
        count++;
      } else {
        row.style.display = 'none';
      }
    });

    resultsCount.textContent = count;
  }

  searchInput.addEventListener('input', applyFilters);
  filterStream.addEventListener('change', applyFilters);
  filterEra.addEventListener('change', applyFilters);
})();
</script>
