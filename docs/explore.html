<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Papers — Human-Agent Decision Making</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="index.html">Human-Agent Decision Making</a>
    <div class="nav-links"><a href="index.html">Home</a> <a href="content/topics/agents-as-advisors.html">Streams</a> <a href="explore.html" class="active">Explore</a> <a href="build.html">Build</a></div>
  </div>
</nav>
<main class="main wide">

<h1 style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 700; margin-bottom: var(--sm);">Explore Papers</h1>
<p style="font-size: 0.92rem; color: var(--text-2); margin-bottom: var(--xl);">Every paper has an evidence strength rating, field status, and a verdict with qualifications. Filter by stream, evidence tier, or keyword.</p>

<div style="display: flex; gap: var(--md); flex-wrap: wrap; margin-bottom: var(--lg); align-items: flex-end;">
  <div style="flex: 1; min-width: 220px;">
    <label style="font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); display: block; margin-bottom: 3px;">Search</label>
    <input type="text" id="q" placeholder="Author, title, or keyword..." style="width: 100%; padding: 7px 11px; font-family: var(--font-body); font-size: 0.86rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); outline: none;">
  </div>
  <div>
    <label style="font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); display: block; margin-bottom: 3px;">Stream</label>
    <select id="fs" style="padding: 7px 11px; font-family: var(--font-body); font-size: 0.86rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card);"></select>
  </div>
  <div>
    <label style="font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); display: block; margin-bottom: 3px;">Evidence</label>
    <select id="fe" style="padding: 7px 11px; font-family: var(--font-body); font-size: 0.86rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card);">
      <option value="all">All</option><option value="strong">Strong</option><option value="mixed">Mixed</option><option value="weak">Weak</option>
    </select>
  </div>
</div>

<div id="ct" style="font-size: 0.82rem; color: var(--text-3); margin-bottom: var(--md);"></div>
<div id="pl"></div>

<script src="assets/js/papers.js"></script>
<script>
// Populate stream filter
const sel = document.getElementById("fs");
sel.innerHTML = '<option value="all">All streams</option>' +
  Object.entries(STREAM_NAMES).map(([k,v]) => '<option value="'+k+'">'+v+'</option>').join("");

function render(f){
  const c=document.getElementById("pl"),ct=document.getElementById("ct");
  ct.textContent=f.length+" paper"+(f.length!==1?"s":"");
  if(!f.length){c.innerHTML='<p style="color:var(--text-3);padding:40px 0;">No papers match.</p>';return;}
  c.innerHTML=f.map(p=>{
    const sb=p.s.map(s=>'<span style="font-size:0.66rem;font-weight:600;color:'+STREAM_COLORS[s]+';margin-right:6px;">'+STREAM_NAMES[s]+'</span>').join("");
    return '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--md) var(--lg);margin-bottom:var(--sm);">'+
      '<div style="display:flex;align-items:baseline;gap:var(--sm);flex-wrap:wrap;margin-bottom:4px;">'+
      '<span class="badge '+EV_CLASS[p.ev]+'">'+p.ev+'</span>'+
      '<span class="badge '+ST_CLASS[p.st]+'">'+p.st+'</span>'+
      '<span style="font-size:0.78rem;color:var(--text-3);">'+p.y+'</span></div>'+
      '<div style="font-family:var(--font-heading);font-size:0.95rem;font-weight:600;margin-bottom:2px;color:var(--text);">'+(p.u?'<a href="'+p.u+'" style="color:var(--text);text-decoration:none;">'+p.t+'</a>':p.t)+'</div>'+
      '<div style="font-size:0.82rem;color:var(--text-3);margin-bottom:var(--sm);">'+p.a+'</div>'+
      '<div style="font-size:0.84rem;color:var(--text-2);line-height:1.5;margin-bottom:var(--sm);">'+p.v+'</div>'+
      '<div style="font-size:0.78rem;color:var(--text-3);padding-top:var(--sm);border-top:1px solid var(--border-light);margin-bottom:var(--xs);">'+p.q+'</div>'+
      '<div style="margin-top:var(--xs);">'+sb+'</div></div>';
  }).join("");
}

function go(){
  const q=document.getElementById("q").value.toLowerCase();
  const s=document.getElementById("fs").value;
  const e=document.getElementById("fe").value;
  render(PAPERS.filter(p=>{
    const mq=!q||p.t.toLowerCase().includes(q)||p.a.toLowerCase().includes(q)||p.v.toLowerCase().includes(q);
    const ms=s==="all"||p.s.includes(s);
    const me=e==="all"||p.ev===e;
    return mq&&ms&&me;
  }));
}

document.getElementById("q").addEventListener("input",go);
document.getElementById("fs").addEventListener("change",go);
document.getElementById("fe").addEventListener("change",go);
render(PAPERS);
</script>

</main>
<footer class="footer"><p>Human-Agent Decision Making — A personal research archive</p></footer>
</body>
</html>
